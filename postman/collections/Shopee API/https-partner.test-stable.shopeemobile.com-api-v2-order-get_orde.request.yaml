scripts:
  - type: beforeRequest
    code: "// 1) Isi 4 variabel ini dulu di tab \"Variables\" Environment Postman:\r

      //    partner_id   -> Partner ID dari open.shopee.com (App Management)\r

      //    partner_key  -> Partner Key dari open.shopee.com (JANGAN di-share/commit ke git)\r

      //    access_token -> didapat setelah proses otorisasi toko (langkah 3 sebelumnya)\r

      //    shop_id      -> didapat bareng access_token setelah otorisasi\r

      \r

      const partnerId = pm.environment.get(\"partner_id\");\r

      const partnerKey = pm.environment.get(\"partner_key\");\r

      const accessToken = pm.environment.get(\"access_token\");\r

      const shopId = pm.environment.get(\"shop_id\");\r

      \r

      // 2) Path endpoint HARUS PERSIS sama dengan yang ada di URL request\r

      const path = \"/api/v2/order/get_order_list\";\r

      \r

      const timestamp = Math.floor(Date.now() / 1000);\r

      \r

      // 3) Base string beda untuk request yang butuh akses toko (pakai access_token+shop_id)\r

      const baseString = partnerId + path + timestamp + accessToken + shopId;\r

      \r

      // 4) Hitung HMAC-SHA256 pakai partner_key sebagai secret, hasil dalam hex\r

      const sign = CryptoJS.HmacSHA256(baseString, partnerKey).toString(CryptoJS.enc.Hex);\r

      \r

      // 5) Simpan hasilnya jadi variabel Postman, supaya bisa dipakai di URL\r

      //    sebagai {{timestamp}} dan {{sign}}\r

      pm.variables.set(\"timestamp\", timestamp);\r

      pm.variables.set(\"sign\", sign);\r

      \r

      console.log(\"Base string:\", baseString);\r

      console.log(\"Timestamp:\", timestamp);\r

      console.log(\"Sign:\", sign);"
    language: text/javascript
order: 1786343718938
