
services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sistem-monitoring:latest
    container_name: sistem-monitoring-app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./phplaravel-storage:/var/www/html/st
      - ./php-custom.ini:/usr/local/etc/php/conf.d/99-custom.ini
    networks:
      - proxy_net
    expose:
      - "80"


  queue:
    image: sistem-monitoring:latest
    container_name: sistem-monitoring-queue
    restart: unless-stopped
    env_file:
      - .env
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - laravel-storage:/app/storage
    networks:
      - proxy_net
    depends_on:
      - app

  scheduler:
    image: sistem-monitoring:latest
    container_name: sistem-monitoring-scheduler
    restart: unless-stopped
    env_file:
      - .env
    command: php artisan schedule:work
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - laravel-storage:/app/storage
    networks:
      - proxy_net
    depends_on:
      - app

networks:
  proxy_net:
    external: true

volumes:
  laravel-storage:
